spring:
  application:
    name: ${APP_NAME:auth-service}

  profiles:
    active: dev

  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true

  # ========== PRIMARY DATABASE ==========
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000
      pool-name: "AuthServiceHikariCP"
      connection-test-query: "SELECT 1"
      validation-timeout: 3000

  # ========== JPA (PRIMARY) ==========
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        default_schema: ${SPRING_JPA_HIBERNATE_DEFAULT_SCHEMA:auth_schema}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}

  # ========== LIQUIBASE ==========
  liquibase:
    enabled: ${SPRING_LIQUIBASE_ENABLED:true}
    change-log: ${SPRING_LIQUIBASE_CHANGE_LOG:classpath:db/changelog/db.changelog-master.xml}
    default-schema: ${SPRING_LIQUIBASE_DEFAULT_SCHEMA:auth_schema}
    liquibase-schema: ${SPRING_LIQUIBASE_SCHEMA:auth_schema}

  # ========== JACKSON JSON CONFIGURATION ==========
  jackson:
    serialization:
      write-null-map-values: false
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

# ========== JWT Configuration ==========
jwt:
  issuer: ${JWT_ISSUER:pet-clinic-auth}
  access-token:
    expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:900}   # 15 хв
  refresh-token:
    expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:604800} # 7 днів
  signing:
    algorithm: HS256
    secret: ${JWT_SECRET:super-secret-key-change-in-production}

# ========== LOGGING ==========
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.micro.auth: ${LOG_LEVEL_APP:DEBUG}
    org:
      apache:
        shiro: ${SHIRO_LOG_LEVEL:DEBUG}
      springframework:
        web: ${SPRING_WEB_LOG_LEVEL:INFO}
        security: ${SPRING_SECURITY_LOG_LEVEL:INFO}
      liquibase: ${LIQUIBASE_LOG_LEVEL:INFO}

# ========== SPRINGDOC OPENAPI (SWAGGER) ==========
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  show-actuator: false

# ========== API Endpoints ==========
end:
  point:
    api: /api/v1
    auth: ${end.point.api}/auth

