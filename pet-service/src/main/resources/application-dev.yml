server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: ${APP_NAME:pet-service}

  # ========== PRIMARY DATABASE ==========
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pet_clinic_pet}?${DB_PARAMS:ssl=false}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    username: ${DB_USERNAME:clinic_user}
    password: ${DB_PASSWORD:123456}

    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 10000

  # ========== JPA (PRIMARY) ==========
  jpa:
    open-in-view: false
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        default_schema: ${SPRING_JPA_HIBERNATE_DEFAULT_SCHEMA:pet_schema}

  # ========== LIQUIBASE ==========
  # PRODUCTION: Liquibase керує міграціями (recommended)
  # DEVELOPMENT: Можна переключити на Hibernate ddl-auto для швидкої розробки
  liquibase:
    enabled: ${SPRING_LIQUIBASE_ENABLED:true}
    change-log: ${SPRING_LIQUIBASE_CHANGE_LOG:classpath:db/changelog/db.changelog-master.xml}
    default-schema: ${SPRING_LIQUIBASE_DEFAULT_SCHEMA:pet_schema}
    liquibase-schema: ${SPRING_LIQUIBASE_SCHEMA:pet_schema}
    contexts: ${SPRING_LIQUIBASE_CONTEXTS:dev}
    drop-first: ${SPRING_LIQUIBASE_DROP_FIRST:false}

  # ========== H2 (Disabled) ==========
  h2:
    console:
      enabled: false

  # ========== JACKSON JSON CONFIGURATION ==========
  jackson:
    serialization:
      write-null-map-values: false  # Не включати null значення в Map
      write-dates-as-timestamps: false  # Використовувати ISO-8601 формат для дат
    default-property-inclusion: non_null  # Приховувати null поля в JSON відповідях
    deserialization:
      fail-on-unknown-properties: false  # Ігнорувати невідомі властивості при десеріалізації


# ========== LOGGING ==========
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.micro.pet: ${LOG_LEVEL_APP:DEBUG}
    org.hibernate.type.descriptor.sql: ${LOG_LEVEL_SQL_PARAMS:TRACE}
    org:
      springframework:
        web: ${SPRING_WEB_LOG_LEVEL:DEBUG}
        security: ${SPRING_SECURITY_LOG_LEVEL:INFO}
        data:
          redis: DEBUG
          jpa: DEBUG
      liquibase: ${LIQUIBASE_LOG_LEVEL:INFO}
      mapstruct: DEBUG

# ========== SPRINGDOC OPENAPI (SWAGGER) ==========
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  show-actuator: false

